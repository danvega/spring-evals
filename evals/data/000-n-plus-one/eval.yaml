name: 000-n-plus-one
project: data
title: Eliminate an N+1 query problem without changing the response
category: data
type: fix
difficulty: hard
baseline_failure: test_failure
pilot: true
boot_version: 4.0.7
timeout_seconds: 900
description: >
  A classic N+1: listing authors lazily loads each author's books, turning
  one request into 31 queries. The agent must recognize the pattern from a
  symptom description (a DBA's query log) and fix it with a fetch join or
  entity graph. Verified by Hibernate statistics: the hidden test asserts
  the prepared statement count per request stays in the single digits
  while the full response is preserved. Tests reasoning about data access,
  not API recall.
