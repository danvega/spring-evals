name: 001-api-versioning
project: framework
title: Version an endpoint with Framework 7 native API versioning
category: web
type: build
difficulty: medium
baseline_failure: test_failure
pilot: true
boot_version: 4.1.1
timeout_seconds: 900
description: >
  Spring Framework 7 added a version attribute to request mappings plus
  ApiVersionConfigurer, and Spring Boot 4 exposes the same setup as
  spring.mvc.apiversion.* properties. Models trained on older content
  hand-roll /v1 and /v2 paths or parse headers manually, which the prompt
  forbids. The agent must configure header-based versioning with a default
  version and serve two response shapes from the same path. The hidden
  tests are black-box HTTP checks. The idiom check looks for a version
  attribute on a request mapping (or a version request predicate in a
  router function) and rejects @RequestHeader; header parsing by hand
  passes the tests but records functional_only.
