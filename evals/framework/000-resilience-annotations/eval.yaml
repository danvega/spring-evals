name: 000-resilience-annotations
project: framework
title: Add retries and concurrency limits without new dependencies
category: config
type: build
difficulty: medium
baseline_failure: test_failure
boot_version: 4.1.1
timeout_seconds: 900
description: >
  Spring Framework 7 ships @Retryable and @ConcurrencyLimit in core,
  enabled by @EnableResilientMethods. Models trained on older content add
  the Spring Retry or Resilience4j dependency, which the prompt forbids.
  The eval verifies behavior over HTTP: a flaky gateway that fails twice
  must succeed in one API call with exactly 3 recorded attempts, and 6
  parallel report requests must never exceed 2 concurrent executions.
  The idiom checks look for the resilience annotation package, a
  @Retryable and a @ConcurrencyLimit usage in any import style or
  placement (method, class, or composed annotation), and evidence that
  the mechanism is switched on, since Boot 4.1 does not auto-configure
  it and the annotations are inert without an enabler. Both
  @EnableResilientMethods and direct registration of the two resilience
  post-processors count. A hand-rolled loop, a Semaphore, a programmatic
  RetryTemplate, an AOP throttle interceptor, or annotations left inert
  next to hand-rolled work passes the tests but records functional_only. The two
  stand-ins the prompt puts off-limits are pinned, so editing the flaky
  gateway or the concurrency counter is a policy failure.
  Known residual: the concurrency assertion carries a wall-clock floor, which
  a candidate cannot forge downward, but the retry assertion still reads its
  attempt count from the controller, which the candidate may rewrite. A
  candidate that returns a literal receipt and a literal count, never calling
  the pinned gateway, would pass that half. Closing it does not need timing:
  the gateway counts attempts per order id and keeps counting, so charging the
  same order twice must report a higher count the second time, which a literal
  cannot do. Not yet implemented. Two further shapes are out of reach of any
  source check: an advisor built on SimpleRetryInterceptor enables retry
  without naming the types this eval requires, and an enable listed under
  META-INF is invisible because source patterns read only src/main.

